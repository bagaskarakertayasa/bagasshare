# Konfigurasi Nginx untuk bagasshare.web.id (berjalan berdampingan dengan bagaslink di VPS yang sama)
# Simpan di: /etc/nginx/sites-available/bagas-share
# Aktifkan: sudo ln -s /etc/nginx/sites-available/bagas-share /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name bagasshare.web.id www.bagasshare.web.id;

    # Folder hasil build frontend Svelte (Vite)
    root /var/www/bagas-share/apps/web/dist;
    index index.html;

    # Endpoint WebSocket Signaling -> diteruskan ke port 3001 (tidak bentrok dengan bagaslink di port 3000)
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        # PENTING: meneruskan IP publik asli pengguna agar deteksi "wifi yang sama" berfungsi
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Endpoint REST API Fitur Berbagi Link 5 GB (Cloudflare R2) -> diteruskan ke port 3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck server
    location /healthz {
        proxy_pass http://127.0.0.1:3001/healthz;
    }

    # Melayani file statis SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
